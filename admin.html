<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>অ্যাডমিন – ডিজাইন আপলোড</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EE;--ink:#0E2A22;--mut:#4F6A60;--card:#fff;--line:#CFDCD3;--green:#14573F;--on:#fff;--red:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0D1A15;--ink:#E8F1EB;--mut:#9DB5A9;--card:#14261F;--line:#27413A;--green:#5FCB9C;--on:#0D1A15;--red:#FF8A80}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0D1A15;--ink:#E8F1EB;--mut:#9DB5A9;--card:#14261F;--line:#27413A;--green:#5FCB9C;--on:#0D1A15;--red:#FF8A80}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Hind Siliguri",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 16px 40px}
.box{max-width:640px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:6px 22px 6px 22px;padding:22px}
h1,h2{font-family:"Noto Serif Bengali",Georgia,serif;font-weight:800;line-height:1.4;margin-bottom:10px}
h1{font-size:26px}h2{font-size:20px}
label{display:block;margin-top:12px;font-size:15px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=color]{padding:2px;height:42px}
input[type=range]{padding:0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}.chk input{width:auto}
button{font:600 17px inherit;font-family:inherit;background:var(--green);color:var(--on);border:0;border-radius:12px;padding:12px 22px;cursor:pointer;margin-top:16px}
button.alt{background:transparent;color:var(--green);border:2px solid var(--green);margin:0}
button.sm{padding:6px 14px;font-size:15px;margin:0}
.msg{margin-top:12px;color:var(--mut)}.err{color:var(--red)}
.row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.row img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--line)}
.row .in{flex:1;min-width:0}
.acts{display:flex;flex-direction:column;gap:6px}
.del{background:transparent;color:var(--red);border:1.5px solid var(--red);margin:0;padding:6px 14px;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:grid;grid-template-columns:2fr 1.4fr 1.2fr;gap:8px;margin:10px 0}
.bar input,.bar select{padding:8px 10px;font-size:15px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.cat{display:flex;gap:8px;margin-top:8px}.cat input{flex:1}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.th div{position:relative}.th img{width:70px;height:88px;object-fit:cover;border-radius:6px;display:block}
.th button{position:absolute;top:-6px;right:-6px;margin:0;padding:0;width:24px;height:24px;border-radius:50%;font-size:15px;background:var(--red);color:#fff}
.pill{font-size:13px;background:var(--line);border-radius:20px;padding:0 8px}
dialog{max-width:600px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:6px 22px 6px 22px;background:var(--card);color:var(--ink);padding:22px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
:focus-visible{outline:3px solid #E3B24A;outline-offset:2px}
@media(max-width:480px){.bar,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box" id="login" hidden>
  <h1>অ্যাডমিন লগইন</h1>
  <form id="lf">
    <label for="em">ইমেইল</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">লগইন করুন</button>
    <p class="msg err" id="le" role="alert"></p>
  </form>
</div>

<div id="panel" hidden>
  <div class="box">
    <div class="top"><h1>নতুন ডিজাইন আপলোড</h1><button class="alt" id="out" type="button">লগআউট</button></div>
    <form id="uf">
      <label for="md">আপলোডের ধরন</label>
      <select id="md">
        <option value="one">একটি ডিজাইন, অনেকগুলো প্রিভিউ ছবি</option>
        <option value="many">প্রতিটি ছবি আলাদা ডিজাইন (নাম ফাইলের নাম থেকে)</option>
      </select>
      <label for="ti" id="til">ডিজাইনের নাম</label><input id="ti">
      <label for="ca">ক্যাটাগরি</label><select id="ca"></select>
      <label for="pr">দাম (টাকা)। ফ্রি হলে ০ লিখুন</label><input id="pr" type="number" min="0" value="0" required>
      <div id="lkw"><label for="lk">ফ্রি ফাইলের ডাউনলোড লিংক (Google Drive/Mega)</label><input id="lk" type="url" placeholder="https://"></div>
      <label for="no">ছোট বিবরণ (যেমন: AI ফাইল, এডিট করা যায়)</label><input id="no">
      <label for="img">প্রিভিউ ছবি (একসাথে একাধিক বাছাই করা যাবে)</label><input id="img" type="file" accept="image/*" multiple required>
      <label class="chk"><input type="checkbox" id="wm" checked> ছবিতে নামের ওয়াটারমার্ক লাগান</label>
      <button type="submit" id="ub">আপলোড করুন</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </div>

  <div class="box">
    <h2>আপলোড করা ডিজাইন</h2>
    <p class="msg" id="tot"></p>
    <div class="bar">
      <input id="fq" type="search" placeholder="নাম দিয়ে খুঁজুন" aria-label="খুঁজুন">
      <select id="fc" aria-label="ক্যাটাগরি ফিল্টার"></select>
      <select id="fs" aria-label="সাজান">
        <option value="new">নতুন আগে</option><option value="old">পুরনো আগে</option>
        <option value="dl">বেশি ডাউনলোড</option><option value="ord">বেশি অর্ডার</option>
      </select>
    </div>
    <div id="list"></div>
  </div>

  <div class="box">
    <h2>সেটিংস</h2>
    <details>
      <summary>ক্যাটাগরি ম্যানেজ</summary>
      <div id="cl"></div>
      <div class="cat"><input id="nc" placeholder="নতুন ক্যাটাগরির নাম" aria-label="নতুন ক্যাটাগরি"><button class="sm" id="ac" type="button">যোগ করুন</button></div>
      <p class="msg" id="cm" role="status"></p>
    </details>
    <details>
      <summary>ওয়াটারমার্ক</summary>
      <label for="wt">লেখা</label><input id="wt">
      <div class="g2">
        <div><label for="ws">সাইজ: <span id="wsv"></span>%</label><input id="ws" type="range" min="2" max="14" step="0.5"></div>
        <div><label for="wo">স্বচ্ছতা: <span id="wov"></span>%</label><input id="wo" type="range" min="5" max="90" step="5"></div>
      </div>
      <label for="wc">রং</label><input id="wc" type="color">
      <p class="msg">এই সেটিং এই ব্রাউজারে সেভ থাকে এবং পরের আপলোড থেকে কাজ করে।</p>
    </details>
    <details>
      <summary>পেজের রং ও থিম</summary>
      <div class="g2">
        <div><label for="tm">মোড</label><select id="tm"><option value="auto">অটো (ফোনের মতো)</option><option value="light">লাইট</option><option value="dark">ডার্ক</option></select></div>
        <div><label for="ta">মূল রং</label><input id="ta" type="color"></div>
      </div>
      <button class="alt sm" id="tr" type="button" style="margin-top:12px">ডিফল্ট রং ফিরিয়ে আনুন</button>
    </details>
  </div>
</div>

<dialog id="ed">
  <h2>ডিজাইন এডিট</h2>
  <form id="ef">
    <label for="et">নাম</label><input id="et" required>
    <label for="ec">ক্যাটাগরি</label><select id="ec"></select>
    <label for="ep">দাম (টাকা)। ফ্রি হলে ০</label><input id="ep" type="number" min="0" required>
    <div id="elw"><label for="el">ফ্রি ফাইলের লিংক</label><input id="el" type="url" placeholder="https://"></div>
    <label for="en">ছোট বিবরণ</label><input id="en">
    <label>বর্তমান ছবি (প্রথমটি কভার)</label>
    <div class="th" id="eth"></div>
    <label for="ei">আরও ছবি যোগ করুন</label><input id="ei" type="file" accept="image/*" multiple>
    <label class="chk"><input type="checkbox" id="ew" checked> নতুন ছবিতে ওয়াটারমার্ক লাগান</label>
    <div class="top"><button type="submit">সেভ করুন</button><button class="alt" type="button" id="ex" style="margin-top:16px">বাতিল</button></div>
    <p class="msg" id="em2" role="status"></p>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const DEF_CATS = ["এডিটেবল Illustrator ফাইল","এডিটেবল Photoshop ফাইল","মাহফিল পোস্টার","মাহফিলের দাওয়াত কার্ড","ব্যানার ডিজাইন","থাম্বনেইল ডিজাইন","লোগো ডিজাইন","বাংলা প্রিমিয়াম ফন্ট","পেইড কোর্স","ক্যানভা প্রো অ্যাকাউন্ট","অন্যান্য"];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const WM = Object.assign({text:"IBRAHIM AHMAD SADI", size:6.5, op:30, color:"#ffffff"}, ls.get("wm")||{});
const TH = Object.assign({mode:"auto", accent:""}, ls.get("th")||{});

function applyTheme(){
  const r = document.documentElement;
  if(TH.mode==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", TH.mode);
  if(TH.accent){
    const n = parseInt(TH.accent.slice(1),16), L = ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114)/1000;
    r.style.setProperty("--green", TH.accent); r.style.setProperty("--on", L>150 ? "#000" : "#fff");
  } else { r.style.removeProperty("--green"); r.style.removeProperty("--on"); }
}
applyTheme();

if(!window.SUPABASE_URL || window.SUPABASE_URL.includes("YOUR_")){
  document.body.innerHTML = '<div class="box"><h1>সেটআপ বাকি</h1><p>config.js ফাইলে Supabase-এর URL আর KEY বসাতে হবে।</p></div>';
} else {
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
let CATS = DEF_CATS.slice(), CROWS = [], DES = [], EDIT = null, EIMG = [];

/* ---------- লগইন ---------- */
function show(on){ $("login").hidden = on; $("panel").hidden = !on; if(on){ initSettings(); loadCats().then(loadList); } }
sb.auth.getSession().then(({data})=>show(!!data.session));
$("lf").onsubmit = async e => {
  e.preventDefault();
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if(error) $("le").textContent = "ইমেইল বা পাসওয়ার্ড ভুল।"; else show(true);
};
$("out").onclick = async () => { await sb.auth.signOut(); show(false); };

/* ---------- ক্যাটাগরি ---------- */
function fillCats(){
  const opts = CATS.map(c=>`<option>${esc(c)}</option>`).join("");
  const keep = [$("ca").value, $("ec").value, $("fc").value];
  $("ca").innerHTML = opts; $("ec").innerHTML = opts;
  $("fc").innerHTML = '<option value="">সব ক্যাটাগরি</option>' + opts;
  if(CATS.includes(keep[0])) $("ca").value = keep[0];
  if(CATS.includes(keep[2])) $("fc").value = keep[2];
}
async function loadCats(){
  const m = $("cm");
  let r = await sb.from("categories").select("*").order("pos").order("id");
  if(r.error){ CATS = DEF_CATS.slice(); CROWS = []; fillCats(); renderCats(); m.className="msg err"; m.textContent = "categories টেবিল পাওয়া যায়নি। নিচের SQL একবার চালান, তারপর রিফ্রেশ দিন।"; return; }
  if(!r.data.length){
    await sb.from("categories").insert(DEF_CATS.map((name,i)=>({name,pos:i})));
    r = await sb.from("categories").select("*").order("pos").order("id");
  }
  CROWS = r.data || []; CATS = CROWS.map(c=>c.name); if(!CATS.length) CATS = DEF_CATS.slice();
  fillCats(); renderCats();
}
function renderCats(){
  $("cl").innerHTML = CROWS.map(c=>`<div class="cat" data-id="${c.id}" data-old="${esc(c.name)}"><input value="${esc(c.name)}" aria-label="ক্যাটাগরির নাম"><button class="sm" data-a="rn" type="button">সেভ</button><button class="del" data-a="dc" type="button">মুছুন</button></div>`).join("");
}
$("cl").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return;
  const row = b.closest(".cat"), id = row.dataset.id, old = row.dataset.old, m = $("cm"); m.className = "msg";
  if(b.dataset.a==="rn"){
    const nn = row.querySelector("input").value.trim(); if(!nn || nn===old) return;
    const r = await sb.from("categories").update({name:nn}).eq("id",id);
    if(r.error){ m.className="msg err"; m.textContent="সমস্যা: "+r.error.message; return; }
    await sb.from("designs").update({category:nn}).eq("category",old);
    m.textContent = "নাম বদলানো হয়েছে, এই ক্যাটাগরির সব ডিজাইনও আপডেট হয়েছে।";
  } else {
    if(!confirm("ক্যাটাগরি \""+old+"\" মুছবেন? এর ডিজাইনগুলো মুছবে না।")) return;
    const r = await sb.from("categories").delete().eq("id",id);
    if(r.error){ m.className="msg err"; m.textContent="সমস্যা: "+r.error.message; return; }
    m.textContent = "মুছে ফেলা হয়েছে।";
  }
  await loadCats(); loadList();
};
$("ac").onclick = async () => {
  const n = $("nc").value.trim(), m = $("cm"); if(!n) return; m.className = "msg";
  const r = await sb.from("categories").insert({name:n, pos:CROWS.length});
  if(r.error){ m.className="msg err"; m.textContent="সমস্যা: "+r.error.message; return; }
  $("nc").value = ""; m.textContent = "যোগ হয়েছে।"; loadCats();
};

/* ---------- সেটিংস: ওয়াটারমার্ক ও থিম ---------- */
function initSettings(){
  $("wt").value = WM.text; $("ws").value = WM.size; $("wo").value = WM.op; $("wc").value = WM.color;
  $("wsv").textContent = WM.size; $("wov").textContent = WM.op;
  $("tm").value = TH.mode; $("ta").value = TH.accent || "#14573F";
}
function saveWM(){
  WM.text = $("wt").value.trim() || "IBRAHIM AHMAD SADI"; WM.size = +$("ws").value; WM.op = +$("wo").value; WM.color = $("wc").value;
  $("wsv").textContent = WM.size; $("wov").textContent = WM.op; ls.set("wm", WM);
}
["wt","ws","wo","wc"].forEach(i => $(i).oninput = saveWM);
$("tm").onchange = () => { TH.mode = $("tm").value; ls.set("th", TH); applyTheme(); };
$("ta").oninput = () => { TH.accent = $("ta").value; ls.set("th", TH); applyTheme(); };
$("tr").onclick = () => { TH.accent = ""; TH.mode = "auto"; ls.set("th", TH); applyTheme(); initSettings(); };

/* ---------- ছবি প্রসেস ও আপলোড ---------- */
function prep(file, wm){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0, c.width, c.height);
      if(wm){
        x.save(); x.globalAlpha = WM.op/100; x.fillStyle = WM.color;
        x.font = "bold " + Math.round(c.width*WM.size/100) + "px sans-serif";
        x.rotate(-Math.PI/6);
        for(let y=-c.height; y<c.height*2; y+=c.width/4)
          for(let p=-c.width; p<c.width*2; p+=c.width*.9) x.fillText(WM.text, p, y);
        x.restore();
      }
      c.toBlob(b => res(b), "image/jpeg", .82);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function upOne(file, wm){
  const blob = await prep(file, wm);
  const path = Date.now() + "-" + Math.random().toString(36).slice(2,7) + ".jpg";
  const up = await sb.storage.from("previews").upload(path, blob, {contentType:"image/jpeg"});
  if(up.error) throw up.error;
  return sb.storage.from("previews").getPublicUrl(path).data.publicUrl;
}
const fname = u => u.split("/").pop();
const imgsOf = d => (Array.isArray(d.images) && d.images.length) ? d.images : (d.preview ? [d.preview] : []);

$("pr").oninput = () => { $("lkw").hidden = (parseInt($("pr").value)||0) > 0; };
$("md").onchange = () => { $("til").textContent = $("md").value==="many" ? "নামের শুরুতে বসবে (ফাঁকা রাখলে শুধু ফাইলের নাম)" : "ডিজাইনের নাম"; };

$("uf").onsubmit = async e => {
  e.preventDefault();
  const m = $("msg"), btn = $("ub"), files = [...$("img").files], many = $("md").value==="many";
  m.className = "msg";
  if(!files.length) return;
  if(!many && !$("ti").value.trim()){ m.className="msg err"; m.textContent="ডিজাইনের নাম লিখুন।"; return; }
  btn.disabled = true;
  const price = parseInt($("pr").value) || 0, base = {category:$("ca").value, price, note:$("no").value.trim(), link: price ? null : $("lk").value.trim()};
  try{
    if(many){
      for(let i=0;i<files.length;i++){
        m.textContent = `আপলোড হচ্ছে ${i+1}/${files.length}...`;
        const u = await upOne(files[i], $("wm").checked);
        const fn = files[i].name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();
        const t = ($("ti").value.trim() + " " + fn).trim();
        const r = await sb.from("designs").insert({...base, title:t, preview:u, images:[u]});
        if(r.error) throw r.error;
      }
    } else {
      const urls = [];
      for(let i=0;i<files.length;i++){ m.textContent = `ছবি আপলোড হচ্ছে ${i+1}/${files.length}...`; urls.push(await upOne(files[i], $("wm").checked)); }
      const r = await sb.from("designs").insert({...base, title:$("ti").value.trim(), preview:urls[0], images:urls});
      if(r.error) throw r.error;
    }
    m.textContent = "আপলোড হয়েছে! এখন সাইটে দেখা যাবে।";
    $("uf").reset(); $("lkw").hidden = false; $("md").onchange(); loadList();
  }catch(err){
    m.className = "msg err"; const t = err.message||String(err);
    m.textContent = "সমস্যা হয়েছে: " + t + (/images/.test(t) ? " (designs টেবিলে images কলাম নেই, নিচের SQL চালান)" : "");
  }
  btn.disabled = false;
};

/* ---------- তালিকা, সার্চ, ফিল্টার ---------- */
async function loadList(){
  const {data} = await sb.from("designs").select("*").order("created_at",{ascending:false});
  DES = data || []; renderList();
}
function renderList(){
  const q = $("fq").value.trim().toLowerCase(), cf = $("fc").value, so = $("fs").value;
  let a = DES.filter(d => (!cf || d.category===cf) && (!q || (d.title||"").toLowerCase().includes(q)));
  if(so==="old") a = a.slice().reverse();
  if(so==="dl") a = a.slice().sort((x,y)=>(y.downloads||0)-(x.downloads||0));
  if(so==="ord") a = a.slice().sort((x,y)=>(y.orders||0)-(x.orders||0));
  $("list").innerHTML = a.map(d => {
    const im = imgsOf(d);
    return `<div class="row"><img src="${esc(im[0])}" alt=""><div class="in"><b>${esc(d.title)}</b> ${im.length>1?`<span class="pill">${im.length}টি ছবি</span>`:""}<br><small>${esc(d.category)} · ${d.price?"৳ "+d.price:"ফ্রি"}</small><br><small><b>${d.price?"WhatsApp অর্ডার ক্লিক: "+(d.orders||0):"ডাউনলোড: "+(d.downloads||0)}</b></small></div>
    <div class="acts"><button class="sm" type="button" data-a="ed" data-id="${d.id}">এডিট</button><button class="del" type="button" data-a="dl" data-id="${d.id}">মুছুন</button></div></div>`;
  }).join("") || "<p class='msg'>" + (DES.length ? "এই ফিল্টারে কিছু পাওয়া যায়নি।" : "এখনো কোনো ডিজাইন নেই।") + "</p>";
  $("tot").textContent = `দেখাচ্ছে ${a.length}/${DES.length}টি · মোট ফ্রি ডাউনলোড: ${DES.reduce((s,d)=>s+(d.downloads||0),0)} · মোট WhatsApp অর্ডার ক্লিক: ${DES.reduce((s,d)=>s+(d.orders||0),0)}`;
}
["fq","fc","fs"].forEach(i => $(i).oninput = renderList);
$("list").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = DES.find(x => String(x.id)===b.dataset.id); if(!d) return;
  if(b.dataset.a==="ed") return openEdit(d);
  if(!confirm("এই ডিজাইনটা মুছে ফেলবেন?")) return;
  const im = imgsOf(d); if(im.length) await sb.storage.from("previews").remove(im.map(fname));
  await sb.from("designs").delete().eq("id", d.id);
  loadList();
};

/* ---------- এডিট ---------- */
function drawThumbs(){
  $("eth").innerHTML = EIMG.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button type="button" data-i="${i}" aria-label="ছবি সরান">×</button></div>`).join("");
}
$("eth").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  if(EIMG.length<2 && !$("ei").files.length){ $("em2").className="msg err"; $("em2").textContent="কমপক্ষে একটি ছবি রাখতে হবে (না হলে আগে নতুন ছবি যোগ করুন)।"; return; }
  EIMG.splice(+b.dataset.i,1); drawThumbs();
};
$("ep").oninput = () => { $("elw").hidden = (parseInt($("ep").value)||0) > 0; };
function openEdit(d){
  EDIT = d; EIMG = imgsOf(d).slice();
  if(!CATS.includes(d.category)) $("ec").insertAdjacentHTML("beforeend", `<option>${esc(d.category)}</option>`);
  $("et").value = d.title||""; $("ec").value = d.category; $("ep").value = d.price||0; $("el").value = d.link||""; $("en").value = d.note||"";
  $("ei").value = ""; $("em2").textContent = ""; $("em2").className = "msg"; $("elw").hidden = (d.price||0) > 0;
  drawThumbs(); $("ed").showModal();
}
$("ex").onclick = () => $("ed").close();
$("ef").onsubmit = async e => {
  e.preventDefault();
  const m = $("em2"), d = EDIT; m.className = "msg"; m.textContent = "সেভ হচ্ছে...";
  try{
    const add = [];
    for(const f of [...$("ei").files]) add.push(await upOne(f, $("ew").checked));
    const final = EIMG.concat(add);
    if(!final.length) throw new Error("কমপক্ষে একটি ছবি লাগবে।");
    const price = parseInt($("ep").value) || 0;
    const r = await sb.from("designs").update({
      title:$("et").value.trim(), category:$("ec").value, price, note:$("en").value.trim(),
      link: price ? null : $("el").value.trim(), preview:final[0], images:final
    }).eq("id", d.id);
    if(r.error) throw r.error;
    const gone = imgsOf(d).filter(u => !final.includes(u));
    if(gone.length) await sb.storage.from("previews").remove(gone.map(fname));
    $("ed").close(); loadList();
  }catch(err){
    m.className = "msg err"; const t = err.message||String(err);
    m.textContent = "সমস্যা হয়েছে: " + t + (/images/.test(t) ? " (images কলাম নেই)" : "") + (/policy|permission|row-level/i.test(t) ? " (designs টেবিলে update পলিসি লাগবে, নিচের SQL দেখুন)" : "");
  }
};
}
</script>
</body>
