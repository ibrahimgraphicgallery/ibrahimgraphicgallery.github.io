<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ইব্রাহীম গ্রাফিক্স গ্যালারী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EE;--ink:#0E2A22;--mut:#4F6A60;--card:#FFFFFF;--line:#CFDCD3;--gold:#B8841C;--goldbg:#F6E7BF;--green:#14573F;--on:#FFFFFF;
--serif:"Noto Serif Bengali",Georgia,serif;--sans:"Hind Siliguri",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0D1A15;--ink:#E8F1EB;--mut:#9DB5A9;--card:#14261F;--line:#27413A;--gold:#E3B24A;--goldbg:#3A2F12;--green:#5FCB9C;--on:#0D1A15}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--sans);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}
.brand{font:800 18px/1.2 var(--serif)}
.contact{font-size:15px;text-decoration:none;border:1.5px solid var(--green);color:var(--green);padding:6px 14px;border-radius:999px}
.banner{margin-top:8px;aspect-ratio:16/7;border-radius:6px 28px 6px 28px;background:url(hero.jpg) center/cover no-repeat,linear-gradient(160deg,#14573F,#0A2E22)}
.hero{padding:30px 0 12px}
.hero h1{font:800 clamp(26px,4.6vw,44px)/1.45 var(--serif);max-width:24em}
.hero p{color:var(--mut);margin-top:14px;max-width:52ch}
.tabwrap{position:relative}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:18px 0 0;border-bottom:2px solid var(--line);scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.drag{cursor:grabbing}
.arr{position:absolute;top:18px;bottom:2px;width:40px;border:0;cursor:pointer;font:600 26px/1 var(--sans);color:var(--green);display:flex;align-items:center;z-index:2}
.arr.l{left:0;justify-content:flex-start;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.arr.r{right:0;justify-content:flex-end;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.arr[hidden]{display:none}
.tab{flex:none;font:500 16px var(--sans);color:var(--mut);background:transparent;border:2px solid transparent;border-bottom:0;padding:9px 18px 11px;border-radius:14px 14px 0 0;cursor:pointer;margin-bottom:-2px}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);border-color:var(--line);border-bottom:2px solid var(--card)}
.tab span{color:var(--gold);font-size:14px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:28px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 6px 22px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.card:hover{border-color:var(--gold)}
.pv{aspect-ratio:4/5;background:linear-gradient(160deg,var(--green),#0A2E22);display:flex;align-items:flex-end;padding:14px;position:relative}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv b{font:800 20px/1.3 var(--serif);color:#fff;position:relative;display:none}
.pv.noimg b,.dpv.noimg b{display:block}
.meta{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.meta strong{font-weight:600;font-size:16px}
.tag{font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;white-space:nowrap}
.free{background:var(--green);color:var(--on)}
.paid{background:var(--goldbg);color:var(--gold)}
.dl{display:inline-block;margin-top:4px;font:500 13px/1.6 var(--sans);color:var(--mut);background:var(--bg);border:1px solid var(--line);padding:0 10px;border-radius:999px}
.empty{grid-column:1/-1;color:var(--mut);padding:40px 0}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(560px,calc(100% - 28px));max-height:calc(100% - 28px);padding:0;overflow:auto}
dialog::backdrop{background:rgba(5,20,14,.65)}
.dpv{aspect-ratio:16/10;background:linear-gradient(160deg,var(--green),#0A2E22);position:relative;display:flex;align-items:flex-end;padding:18px}
.dpv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dpv b{font:800 24px/1.3 var(--serif);color:#fff;position:relative;display:none}
.dbody{padding:20px}
.dbody h3{font:800 20px/1.4 var(--serif);margin-bottom:6px}
.btn{display:inline-block;font:600 17px var(--sans);background:var(--green);color:var(--on);border:0;border-radius:12px;padding:12px 22px;cursor:pointer;text-decoration:none;margin-top:12px}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
.close{float:right;background:none;border:0;font-size:28px;line-height:1;color:var(--ink);cursor:pointer;padding:6px 10px}
.pay{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;font-size:16px}
.pay ol{padding-left:20px}
.num{font:600 22px var(--sans);letter-spacing:.04em}
label{display:block;margin-top:10px;font-size:15px;color:var(--mut)}
input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.connect{margin:8px 0 48px;border-radius:6px 28px 6px 28px;padding:clamp(26px,5vw,48px);color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(227,178,74,.22),transparent 55%),linear-gradient(160deg,#14573F,#0A2E22)}
.connect::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(227,178,74,.28);box-shadow:0 0 0 22px rgba(227,178,74,.07);pointer-events:none}
.connect h2{font:800 clamp(22px,3.6vw,32px)/1.5 var(--serif);max-width:20em;position:relative}
.connect>p{margin-top:8px;color:rgba(255,255,255,.82);max-width:50ch;position:relative}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px;position:relative;z-index:1}
.lk{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:6px 20px 6px 20px;padding:14px 16px;transition:transform .2s,border-color .2s,background .2s}
.lk:hover{transform:translateY(-3px);border-color:#E3B24A;background:rgba(255,255,255,.14)}
.ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ico svg{width:26px;height:26px;fill:#fff}
.lk b{display:block;font:600 16px/1.3 var(--sans)}
.lk small{display:block;font-size:14px;color:rgba(255,255,255,.78);letter-spacing:.02em}
.lk .go{margin-left:auto;font-size:22px;color:#E3B24A}
@media (prefers-reduced-motion:reduce){.lk{transition:none}.lk:hover{transform:none}}
footer{border-top:1px solid var(--line);padding:24px 0 36px;color:var(--mut);font-size:15px}
</style>
</head>

    <div class="brand" id="brand"></div>

  <div class="banner" role="img" aria-label="ইব্রাহীম গ্রাফিক্স গ্যালারী"></div>
  <section class="hero">
    <h1>ইব্রাহীম গ্রাফিক্স গ্যালারিতে পেয়ে যাচ্ছেন নান্দনিক সব ডিজাইন, সহজে হাতের মুঠোয়</h1>

    <div class="tabs" id="tabs" role="tablist" aria-label="ক্যাটাগরি"></div>
    <button class="arr r" id="ar" type="button" aria-label="ডানে যান">›</button>
  </div>
  <main class="grid" id="grid"></main>
  <section class="connect" aria-labelledby="ch">

    <div class="links" id="links"></div>
  </section>
  <footer id="foot"></footer>
</div>
<dialog id="dlg" aria-labelledby="dtitle">
  <button class="close" id="x" aria-label="বন্ধ করুন">×</button>
  <div class="dpv" id="dpv"></div>
  <div class="dbody" id="dbody"></div>
</dialog>

function count(c){return c===CATEGORIES[0]?DESIGNS.length:DESIGNS.filter(d=>d.category===c).length}
let moved=false;
function updArr(){
  const t=$("tabs"),max=t.scrollWidth-t.clientWidth;
  $("al").hidden=t.scrollLeft<=2;
  $("ar").hidden=t.scrollLeft>=max-2;
}
function renderTabs(){
  const t=$("tabs"),keep=t.scrollLeft;
  t.innerHTML = CATEGORIES.map(c=>
    `<button class="tab" role="tab" aria-selected="${c===current}" data-c="${esc(c)}">${esc(c)}<span>${count(c)}</span></button>`).join("");

  t.scrollLeft=keep;updArr();

(function(){
  const t=$("tabs");let down=false,sx=0,sl=0;
  t.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=t.scrollLeft});
  window.addEventListener("pointermove",e=>{
    if(!down)return;const dx=e.clientX-sx;
    if(Math.abs(dx)>5){moved=true;t.classList.add("drag")}
    if(moved)t.scrollLeft=sl-dx;
  });
  window.addEventListener("pointerup",()=>{down=false;t.classList.remove("drag");setTimeout(()=>{moved=false},0)});
  t.addEventListener("wheel",e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){t.scrollLeft+=e.deltaY;e.preventDefault()}
  },{passive:false});
  t.addEventListener("scroll",updArr);
  window.addEventListener("resize",updArr);
  $("al").onclick=()=>t.scrollBy({left:-240,behavior:"smooth"});
  $("ar").onclick=()=>t.scrollBy({left:240,behavior:"smooth"});
})();
function pv(d,cls){
  return `<img src="${esc(d.preview||"")}" alt="${esc(d.title)}" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()"><b>${esc(d.title)}</b>`;
}
function renderGrid(){
  const list = current===CATEGORIES[0]?DESIGNS:DESIGNS.filter(d=>d.category===current);
  $("grid").innerHTML = list.length ? list.map(d=>{
    const i = DESIGNS.indexOf(d);
    const dlText = (d.downloads||0) > 0 ? `<br><span class="dl">↓ ${d.downloads} ডাউনলোড</span>` : "";
    return `<button class="card" data-i="${i}"><div class="pv">${pv(d)}</div>
    <div class="meta"><div><strong>${esc(d.title)}</strong>${dlText}</div>
    <span class="tag ${d.price?"paid":"free"}">${d.price?"৳ "+d.price:"ফ্রি"}</span></div></button>`}).join("")
    : `<p class="empty">এই ক্যাটাগরিতে এখনো কোনো ডিজাইন নেই।</p>`;
  $("grid").querySelectorAll(".card").forEach(b=>b.onclick=()=>openDesign(DESIGNS[b.dataset.i]));
}
function countDl(d){
  d.downloads=(d.downloads||0)+1;renderGrid();
  if(sbc&&d.id!=null)sbc.rpc("increment_downloads",{design_id:String(d.id)}).then(()=>{},()=>{});
}
function openDesign(d){
  $("dpv").innerHTML = pv(d);
  let h = `<h3 id="dtitle">${esc(d.title)}</h3><p style="color:var(--mut)">${esc(d.category)}${d.note?" · "+esc(d.note):""}</p>`;
  if(!d.price){
    h += `<a class="btn" id="dlb" href="${esc(d.link||"#")}" target="_blank" rel="noopener">ফ্রি ডাউনলোড করুন</a>`;
  } else {
    h += `<div class="pay"><p><strong>দাম: ৳ ${d.price}</strong></p>
    <ol><li>bKash বা Nagad থেকে <b>Send Money</b> করুন:<br><span class="num">${esc(SITE.number)}</span></li>
    <li>নিচে আপনার নাম, নম্বর আর TrxID লিখুন</li>
    <li>পেমেন্ট মিলিয়ে দেখে আমি ফাইলের লিংক পাঠিয়ে দেব</li></ol>
    <button class="btn alt" id="cp" type="button">নম্বর কপি করুন</button>
    <label for="nm">আপনার নাম</label><input id="nm" autocomplete="name">
    <label for="ph">আপনার নম্বর</label><input id="ph" inputmode="tel" autocomplete="tel">
    <label for="tx">TrxID</label><input id="tx" autocapitalize="characters">
    <button class="btn" id="send" type="button">WhatsApp-এ পাঠান</button>
    <p id="err" style="color:#B3261E;margin-top:8px" role="alert"></p></div>`;
  }
  $("dbody").innerHTML = h;
  if(!d.price){
    $("dlb").addEventListener("click",()=>countDl(d));
  }
  if(d.price){
    $("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(SITE.number);$("cp").textContent="কপি হয়েছে"};
    $("send").onclick=()=>{
      const n=$("nm").value.trim(),p=$("ph").value.trim(),t=$("tx").value.trim();
      if(!n||!p||!t){$("err").textContent="নাম, নম্বর আর TrxID তিনটাই লিখুন।";return}
      const m=`আসসালামু আলাইকুম। আমি "${d.title}" (৳ ${d.price}) কিনতে চাই।\nনাম: ${n}\nনম্বর: ${p}\nTrxID: ${t}`;
      window.open("https://wa.me/"+SITE.whatsapp+"?text="+encodeURIComponent(m),"_blank");
      countDl(d);
    };
  }
  $("dlg").showModal();
}
$("x").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
renderTabs();renderGrid();
if(sbc){
  sbc.from("designs").select("*").order("created_at",{ascending:false})
    .then(({data,error})=>{ if(!error&&data){DESIGNS=data.map(d=>({...d,category:OLD_NAMES[d.category]||d.category}));renderTabs();renderGrid()} });
}
</script>
</body>
</html>
